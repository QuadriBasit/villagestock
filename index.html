<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f8fafc" />

    <!-- Primary SEO -->
    <title>VillageStock — Business OS for Gadget &amp; Electronics Shops</title>
    <meta
      name="description"
      content="VillageStock is the offline-first business OS for electronics and gadget retailers — manage inventory, sales, repairs, credits and reports in one app. Works offline, syncs everywhere."
    />
    <meta
      name="keywords"
      content="inventory management, gadget shop software, electronics retail, phone shop POS, repair tracking, offline POS, Nigeria retail software, IMEI tracking, sales and stock management"
    />
    <meta name="author" content="VillageStock" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://villagestock.online/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VillageStock" />
    <meta property="og:url" content="https://villagestock.online/" />
    <meta property="og:title" content="VillageStock — Business OS for Gadget &amp; Electronics Shops" />
    <meta
      property="og:description"
      content="Manage inventory, sales, repairs, credits and reports in one offline-first app built for electronics and gadget retailers."
    />
    <meta property="og:image" content="https://villagestock.online/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_NG" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VillageStock — Business OS for Gadget &amp; Electronics Shops" />
    <meta
      name="twitter:description"
      content="Manage inventory, sales, repairs, credits and reports in one offline-first app built for electronics and gadget retailers."
    />
    <meta name="twitter:image" content="https://villagestock.online/og-image.png" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VillageStock" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "VillageStock",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web, iOS, Android",
        "description": "Offline-first business OS for electronics and gadget retailers — inventory, sales, repairs, credits and reporting in one app.",
        "url": "https://villagestock.online/",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "NGN",
          "description": "14-day free trial, no credit card required."
        },
        "publisher": {
          "@type": "Organization",
          "name": "VillageStock",
          "url": "https://villagestock.online/"
        }
      }
    </script>
    <script>
      (function () {
        try {
          var k = 'villagestock-theme';
          var m = localStorage.getItem(k);
          var dark =
            m === 'dark' || ((m === null || m === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
